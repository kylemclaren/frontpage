<!doctype html>
<!--
  Source for public/og.jpg (the Open Graph / social preview card).
  To regenerate: run `bun run dev`, open http://localhost:4791/scripts/og/og.html
  in a 1200×630 viewport at 2× pixel density and screenshot it, then shrink it to
  1200×630 and save as JPEG (about 150 KB; keep it under 300 KB for WhatsApp):
    sips -z 630 1200 shot.png --out og.png && sips -s format jpeg -s formatOptions 88 og.png --out public/og.jpg
  Story titles below are invented for illustration.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frontpage OG card</title>
    <script type="module">
      import "@fontsource-variable/inter"
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0b0a;
      }
      body {
        position: relative;
        font-family: "Inter Variable", system-ui, sans-serif;
        color: #f4f2ee;
        -webkit-font-smoothing: antialiased;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(620px 420px at 88% 18%, rgb(255 110 30 / 0.28), transparent 70%),
          radial-gradient(520px 380px at 8% 105%, rgb(255 90 20 / 0.12), transparent 70%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(255 255 255 / 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 0.045) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(900px 520px at 70% 40%, #000 30%, transparent 80%);
      }
      .left {
        position: absolute;
        left: 72px;
        top: 64px;
        bottom: 64px;
        width: 520px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font:
          700 34px ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: -0.02em;
      }
      .brand svg {
        width: 56px;
        height: 56px;
        filter: drop-shadow(0 8px 24px rgb(255 100 20 / 0.35));
      }
      h1 {
        margin-top: auto;
        font-size: 66px;
        line-height: 1.02;
        font-weight: 750;
        letter-spacing: -0.035em;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(100deg, #ffb070, #ff6a1a 55%, #ff4d00);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub {
        margin-top: 22px;
        font-size: 23px;
        line-height: 1.45;
        color: #a9a49b;
        max-width: 480px;
      }
      .sub b {
        color: #f4f2ee;
        font-weight: 600;
      }
      .pills {
        margin-top: 30px;
        display: flex;
        gap: 10px;
      }
      .pill {
        font-size: 15px;
        font-weight: 500;
        color: #cfcac1;
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid rgb(255 255 255 / 0.12);
        background: rgb(255 255 255 / 0.04);
      }

      .card {
        position: absolute;
        left: 640px;
        top: 70px;
        width: 620px;
        border-radius: 26px;
        padding: 14px 20px;
        background: linear-gradient(180deg, rgb(28 27 25 / 0.96), rgb(20 19 18 / 0.96));
        border: 1px solid rgb(255 255 255 / 0.09);
        box-shadow:
          0 40px 80px rgb(0 0 0 / 0.55),
          0 0 0 1px rgb(255 120 40 / 0.06);
        transform: perspective(1400px) rotateY(-8deg) rotateX(3deg);
        transform-origin: left center;
      }
      .row {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 16px;
        align-items: start;
        padding: 18px 4px;
        border-bottom: 1px solid rgb(255 255 255 / 0.07);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row.dim {
        opacity: 0.38;
      }
      /* The card bleeds off the right edge; keep its text inside the visible part. */
      .row > div:last-child {
        padding-right: 84px;
      }
      .ring {
        position: relative;
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
      }
      .ring svg {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
      }
      .ring span {
        font:
          700 15px ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: #a9a49b;
      }
      .ring.hot span {
        color: #ff8a3d;
      }
      .title {
        font-size: 21px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .meta {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
        font:
          14px ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: #8a857c;
      }
      .chip {
        font:
          600 13px "Inter Variable",
          sans-serif;
        padding: 3px 10px;
        border-radius: 999px;
        background: rgb(255 106 26 / 0.16);
        color: #ff9a5c;
      }
      .chip.skip {
        background: none;
        border: 1px dashed rgb(255 255 255 / 0.25);
        color: #8a857c;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>

    <section class="left">
      <div class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff9147" />
              <stop offset="1" stop-color="#f04a00" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="15" fill="url(#bg)" />
          <circle cx="20" cy="22" r="7.5" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="4" />
          <circle
            cx="20"
            cy="22"
            r="7.5"
            fill="none"
            stroke="#fff"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="34.87 47.12"
            transform="rotate(-90 20 22)"
          />
          <rect x="33" y="18" width="19" height="8" rx="4" fill="#fff" />
          <rect x="12" y="36" width="40" height="5" rx="2.5" fill="#fff" fill-opacity=".55" />
          <rect x="12" y="46" width="27" height="5" rx="2.5" fill="#fff" fill-opacity=".3" />
        </svg>
        Frontpage
      </div>

      <h1>Hacker News,<br /><em>ranked for you.</em></h1>
      <p class="sub">
        Tell it what you're into, or let <b>ChatGPT or Claude</b> tell it for you. Every story gets a score.
      </p>
      <div class="pills">
        <span class="pill">No login</span>
        <span class="pill">Ask your AI</span>
        <span class="pill">Skip what you don't</span>
      </div>
    </section>

    <section class="card" id="card"></section>

    <script>
      // Invented stories, for illustration only.
      const rows = [
        {
          score: 94,
          title: "Show HN: A microVM sandbox for agents that boots in 30ms",
          meta: "412 pts · 3h · 188 comments",
          chip: "Computers for agents",
        },
        {
          score: 81,
          title: "Lessons from running 2,000 Postgres clusters in production",
          meta: "356 pts · 5h · 142 comments",
          chip: "Postgres operations",
        },
        {
          score: 63,
          title: "What we learned shipping an MCP server to 10k developers",
          meta: "198 pts · 2h · 77 comments",
          chip: "Agent harnesses and MCP",
        },
        {
          score: 6,
          title: "Token prices swing again as another exchange halts withdrawals",
          meta: "88 pts · 1h · 64 comments",
          chip: "Crypto",
          skip: true,
        },
      ]
      const r = 21,
        c = 2 * Math.PI * r
      document.getElementById("card").innerHTML = rows
        .map(
          (s) => `
        <div class="row${s.skip ? " dim" : ""}">
          <div class="ring${s.score >= 70 ? " hot" : ""}">
            <svg viewBox="0 0 52 52">
              <circle cx="26" cy="26" r="${r}" fill="none" stroke="rgb(255 255 255 / 0.1)" stroke-width="4" />
              <circle cx="26" cy="26" r="${r}" fill="none" stroke="#ff6a1a" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c * s.score) / 100} ${c}" />
            </svg>
            <span>${s.score}</span>
          </div>
          <div>
            <div class="title">${s.title}</div>
            <div class="meta">${s.meta} <span class="chip${s.skip ? " skip" : ""}">${s.skip ? "⊘ " : ""}${s.chip}</span></div>
          </div>
        </div>`,
        )
        .join("")
    </script>
  </body>
</html>
